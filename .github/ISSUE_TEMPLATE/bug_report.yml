name: Bug report
description: Report a reproducible Codex Bell problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Codex Bell issue.

        请不要粘贴真实 Prompt、源码、Token、私有 URL、绝对项目路径或未经脱敏的诊断信息。
        Please do not paste real prompts, source code, tokens, private URLs, absolute project paths, or unredacted diagnostics.

  - type: input
    id: macos
    attributes:
      label: macOS version / macOS 版本
      placeholder: "e.g. macOS 15.x"
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Mac architecture / Mac 架构
      placeholder: "Apple silicon / Intel"
    validations:
      required: true

  - type: input
    id: codex
    attributes:
      label: Codex version / Codex 版本
    validations:
      required: true

  - type: input
    id: bell
    attributes:
      label: Codex Bell version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed prompts, secrets, private paths, private URLs, and source code from this report. / 我已移除 Prompt、密钥、私人路径、私人 URL 和源码。
          required: true
